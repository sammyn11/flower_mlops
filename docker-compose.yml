services:
  api:                       # scale with: docker compose up -d --scale api=3
    build: { context: ., dockerfile: Dockerfile.api }
    volumes:
      - ./data:/app/data     # shared by every replica (uploads, DB)
      - ./models:/app/models # shared model file + job state
    environment:
      RETRAIN_THRESHOLD: "50"
      AUTO_RETRAIN: "true"
    expose: ["8000"]
    restart: unless-stopped
  nginx:                     # load balancer in front of the API replicas
    image: nginx:1.25-alpine
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8080:80"]
    depends_on: [api]
    restart: unless-stopped
  ui:
    build: { context: ., dockerfile: Dockerfile.ui }
    environment:
      API_URL: http://nginx
    ports: ["8501:8501"]
    depends_on: [nginx]
    restart: unless-stopped
